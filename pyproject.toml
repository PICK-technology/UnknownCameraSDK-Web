[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown-camera-sdk"
version = "0.1.0"
description = "Local IP camera discovery and management toolkit"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
